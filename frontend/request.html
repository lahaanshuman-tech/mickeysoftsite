<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Request Software — MickeySoft</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="container narrow card">
    <h2>Request a custom software</h2>
    <label>Your email</label>
    <input id="email" class="input" placeholder="you@example.com">
    <label>Title</label>
    <input id="title" class="input" placeholder="Short title">
    <label>Details</label>
    <textarea id="desc" class="input" rows="5" placeholder="Describe the software"></textarea>
    <div class="row">
      <button id="btnReq" class="btn">Submit Request</button>
      <a href="index.html" class="link">Back</a>
    </div>
    <div id="msg" class="muted"></div>
  </div>
<script>
document.getElementById('btnReq').addEventListener('click', async () => {
  const payload = {
    email: document.getElementById('email').value.trim(),
    // Note: The backend expects 'software' not 'title'. See point 3 below!
    software: document.getElementById('title').value.trim(),
    body: document.getElementById('desc').value.trim() // 'body' might be safer than 'desc'
  };
  
  // *** FIX 1: Change endpoint to singular /api/request ***
  // *** FIX 2: Change Content-Type to application/json ***
  const res = await fetch('/api/request', { 
    method: 'POST', 
    headers: {
      'Content-Type': 'application/json' 
    }, 
    body: JSON.stringify(payload)
  });
  
  const j = await res.json();
  if (j.ok) {
    alert('Request submitted');
    location.href = 'index.html';
  } else {
    document.getElementById('msg').innerText = j.error || 'Error';
  }
});
</script>
</body>
</html>
